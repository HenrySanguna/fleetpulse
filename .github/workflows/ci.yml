name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # nx-set-shas needs this to query the last successful push-event workflow
  # run on main via the Actions API when diffing "affected" projects on
  # push (pull_request diffs against the PR base directly and never hit
  # this path, which is why this was broken silently on every push to main
  # -- gh pr checks only ever surfaces the pull_request-triggered run).
  actions: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # See openspec/changes/00-bootstrap-monorepo/design.md, "Riesgo
      # documentado": Gradle-under-Nx is reported flaky in CI in some setups.
      # Mitigation here is pinning versions -- this step's java-version plus
      # backend/gradle/wrapper/gradle-wrapper.properties and the plugin
      # versions in backend/build.gradle.kts -- deliberately NOT automatic
      # retries, which would mask the problem instead of surfacing it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: nrwl/nx-set-shas@v5

      # Covers both apps/console (Angular, via the @nx/angular-inferred
      # targets) and backend/{api,processor,domain,geo-core} (Gradle, via
      # the @nx/gradle project-graph integration registered in nx.json). A
      # commit that only touches apps/console must not run any Gradle task
      # here; a commit touching backend/domain must affect both api and
      # processor (see tasks.md, "Definicion de terminado").
      # api/domain/processor each spin up their own real PostGIS + Mosquitto
      # Testcontainers pair. `--parallel=1` here (tried in PR #37 chasing
      # issue #36) had ZERO effect -- reproduced 5/5 on 04-add-live-map's PRs
      # #38-#42 -- because @nx/gradle batches every affected Gradle
      # subproject's test task into ONE external `gradle-batch-runner-all.jar`
      # process outside Nx's own task scheduler entirely, so this flag (which
      # only throttles Nx's own scheduler) never reaches it.
      # `backend/gradle.properties`' `org.gradle.parallel=false` does stop
      # concurrent subproject execution (Gradle itself reads it regardless of
      # which tool launched the build), so --parallel is back to a normal
      # value here for unrelated-task throughput (e.g. console lint/test
      # alongside the backend batch) -- but that was never actually issue
      # #36's cause; see SecuredMosquittoTestSupport for the real one.
      - name: nx affected -- lint, test, build
        run: npx nx affected -t lint test build --parallel=3 --outputStyle=static

      # Runs on every CI run, not scoped to "affected": libs/api-client can
      # go stale from a hand-edit even on a commit where nx does not
      # consider backend/api itself affected (tasks 6.1 and 4.3).
      - name: API client drift check
        run: npm run generate:api-client:check

  docker-and-compose-smoke:
    runs-on: ubuntu-latest
    needs: affected
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t fleetpulse-backend:ci .

      # Reuses docker/postgis-partman/Dockerfile and
      # docker/mosquitto/mosquitto.conf -- the same images docker-compose.yml
      # already uses for local dev, and that the Gradle Testcontainers-backed
      # tests build from directly (task 6.2).
      - name: Start PostGIS and Mosquitto
        run: docker compose -p fleetpulse-ci up -d --wait

      - name: Run api and processor against them, verify /actuator/health
        run: |
          set -euo pipefail

          network=$(docker network ls --filter label=com.docker.compose.project=fleetpulse-ci --format '{{.Name}}')

          # FLEETPULSE_MQTT_SERVICE_USERNAME/PASSWORD must match
          # docker-compose.yml's MOSQUITTO_DYNSEC_SERVICE_* values below --
          # that is the "internal-services" dynsec identity
          # bootstrap-and-run.sh provisions on this same Mosquitto container.
          # FleetpulseMqttServiceCredentialsProperties (both modules) is
          # deliberately not @NotBlank, so omitting these does not fail
          # startup -- api/processor just connect with blank credentials and
          # get rejected at the MQTT layer instead (mqttBroker/
          # processorHeartbeat DOWN, never UP).
          run_common=(
            -e SPRING_PROFILES_ACTIVE=prod
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://postgis:5432/fleetpulse
            -e SPRING_DATASOURCE_USERNAME=fleetpulse
            -e SPRING_DATASOURCE_PASSWORD=fleetpulse
            -e FLEETPULSE_MQTT_BROKERURL=tcp://mosquitto:1883
            -e FLEETPULSE_MQTT_SERVICE_USERNAME=internal-services
            -e FLEETPULSE_MQTT_SERVICE_PASSWORD=fleetpulse-dynsec-service
          )

          wait_http() {
            for _ in $(seq 1 40); do
              curl -s -o /dev/null "$1" && return 0
              sleep 2
            done
            echo "timed out waiting for $1" >&2
            return 1
          }

          wait_healthy() {
            for _ in $(seq 1 40); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$1")
              [ "$status" = "healthy" ] && return 0
              if [ "$status" = "unhealthy" ]; then
                echo "$1 reported unhealthy:" >&2
                docker logs "$1"
                return 1
              fi
              sleep 3
            done
            echo "$1 did not become healthy in time:" >&2
            docker logs "$1"
            return 1
          }

          docker run -d --name ci-api --network "$network" \
            "${run_common[@]}" -e FLEETPULSE_PROCESS=api -p 8080:8080 \
            fleetpulse-backend:ci
          wait_http http://localhost:8080/actuator/health

          # No processor running yet: the processorHeartbeat indicator (task
          # 5.3) must be DOWN, and so must the aggregate status. If this ever
          # reports UP, the heartbeat check is not wired to anything real.
          curl -s http://localhost:8080/actuator/health | grep -q '"status":"DOWN"'

          docker run -d --name ci-processor --network "$network" \
            "${run_common[@]}" -e FLEETPULSE_PROCESS=processor \
            fleetpulse-backend:ci
          wait_healthy ci-processor

          # processor publishes its first retained heartbeat within 30s of
          # startup; api's own Docker HEALTHCHECK re-polls every 10s, so this
          # picks up the transition once it happens.
          wait_healthy ci-api
          curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Tear down
        if: always()
        run: |
          docker rm -f ci-api ci-processor 2>/dev/null || true
          docker compose -p fleetpulse-ci down -v

  # Builds and pushes the single api+processor image to GHCR (no new account
  # needed -- GHCR authenticates with the workflow's own GITHUB_TOKEN), then
  # deploys api + processor + mosquitto together on the Oracle Cloud Always
  # Free VM over SSH + Docker Compose (docker-compose.prod.yml). Replaces
  # the prior two-Fly-app split (fly.toml + fly-broker.toml, deploy-broker +
  # deploy-backend): one VM, one compose stack, the same shape as local
  # dev's docker-compose.yml, just remote -- see
  # openspec/changes/00-bootstrap-monorepo/tasks.md, task 6.5, for why Fly's
  # tier stopped qualifying as a permanent free tier (project.md's cost-zero
  # rule) and why Oracle's Always Free Ampere A1 VM does. Gated behind a
  # repository *variable* so merging this workflow does not start failing
  # CI on main before the VM/secrets exist -- flip
  # vars.ORACLE_DEPLOY_ENABLED to "true" once task 6.5's manual steps are
  # done.
  deploy-oracle:
    runs-on: ubuntu-latest
    needs: [affected, docker-and-compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ORACLE_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The Oracle Always Free target (task 6.5) is an Ampere A1 VM --
      # arm64, not this runner's native amd64. A plain `docker build` here
      # produces an amd64 image that fails on the VM with "exec format
      # error" at container start (found live in production: PR review
      # never caught it because docker-and-compose-smoke builds and runs
      # on this same amd64 runner, so it never exercises the mismatch).
      # QEMU + buildx cross-compiles arm64 on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ghcr.io image paths must be lowercase; the repo owner (HenrySanguna)
      # is not, so this is hardcoded rather than templated from
      # github.repository_owner.
      - name: Build and push backend image (linux/arm64)
        run: |
          image=ghcr.io/henrysanguna/fleetpulse-backend
          docker buildx build --platform linux/arm64 --push \
            -t "$image:${{ github.sha }}" -t "$image:latest" .

      - name: Deploy to Oracle VM over SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_SSH_HOST }}" >> ~/.ssh/known_hosts

          rsync -az --relative -e "ssh -i ~/.ssh/oracle_deploy_key" \
            docker-compose.prod.yml docker/mosquitto/mosquitto.prod.conf docker/mosquitto/bootstrap-and-run.sh docker/mosquitto/provision-demo-simulator.sh docker/caddy/Caddyfile docker/demo/seed-demo-fleet.sql docker/demo/run-seed.sh \
            "${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:/opt/fleetpulse/"

          # caddy/mosquitto's config is bind-mounted, not baked into their
          # (unchanged-tag) images, so plain `up -d` never notices it
          # changed and leaves them running stale config -- found live
          # (wss:// handshake 404 after the 07-expose-live-map-ws deploy).
          # --force-recreate them explicitly, BEFORE the second `up -d`
          # recreates api/processor (their image tag changes every deploy):
          # api/processor's MQTT client has automaticReconnect disabled, so
          # mosquitto must already be on the new config by the time they
          # reconnect, not after.
          ssh -i ~/.ssh/oracle_deploy_key "${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}" \
            "cd /opt/fleetpulse && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml pull && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d --force-recreate caddy mosquitto && IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d"

      # Prod demo service (odd/tasks/prod-demo-simulator.md, task 5.5): opt-in
      # by design -- entirely skipped unless the MOSQUITTO_DEMO_SIMULATOR_PASSWORD
      # repo secret exists, so merging this workflow never starts the demo
      # fleet on its own (same gating pattern as vars.ORACLE_DEPLOY_ENABLED
      # above). Seed and dynsec provisioning are both idempotent (ON
      # CONFLICT DO NOTHING / tolerate "already exists"), so this step is
      # safe to run on every deploy once the secret is set, not just once.
      # The secret value is interpolated into a single-quoted shell argument
      # twice (this runner's shell, then the remote one over ssh) -- keep it
      # alphanumeric, no single quotes, when setting the repo secret.
      - name: Seed and start the demo simulator (opt-in)
        if: ${{ secrets.MOSQUITTO_DEMO_SIMULATOR_PASSWORD != '' }}
        env:
          MOSQUITTO_DEMO_SIMULATOR_PASSWORD: ${{ secrets.MOSQUITTO_DEMO_SIMULATOR_PASSWORD }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_deploy_key "${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}" \
            "cd /opt/fleetpulse && \
             docker compose -f docker-compose.prod.yml --profile demo run --rm demo-seed && \
             docker compose -f docker-compose.prod.yml exec -T -e MOSQUITTO_DEMO_SIMULATOR_PASSWORD='$MOSQUITTO_DEMO_SIMULATOR_PASSWORD' mosquitto sh /mosquitto/provision-demo-simulator.sh && \
             MOSQUITTO_DEMO_SIMULATOR_PASSWORD='$MOSQUITTO_DEMO_SIMULATOR_PASSWORD' IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml --profile demo up -d simulator"

  # Task 6.6: "SHA correcto y latido de processor reciente" (design.md,
  # "Salud"). Same two JSON-path assertions as before, now pointed at the
  # Oracle VM's public host (vars.PROD_API_URL) instead of a *.fly.dev
  # hostname -- there is no Fly-managed DNS anymore, so this is a
  # repository variable set once the VM has a known address (task 6.5).
  # curl and jq are both preinstalled on ubuntu-latest; no new dependency.
  verify-deploy:
    runs-on: ubuntu-latest
    needs: deploy-oracle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ORACLE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Verify deployed SHA and processor heartbeat
        run: |
          set -euo pipefail
          base="${{ vars.PROD_API_URL }}"

          fetch() {
            for _ in $(seq 1 10); do
              if body=$(curl -fsS "$1"); then
                echo "$body"
                return 0
              fi
              sleep 3
            done
            echo "failed to reach $1" >&2
            return 1
          }

          info=$(fetch "$base/actuator/info")
          deployed_sha=$(echo "$info" | jq -er '.git.commit.id.full')
          if [ "$deployed_sha" != "${{ github.sha }}" ]; then
            echo "deployed SHA $deployed_sha does not match workflow SHA ${{ github.sha }}" >&2
            exit 1
          fi

          health=$(fetch "$base/actuator/health")
          heartbeat_status=$(echo "$health" | jq -er '.components.processorHeartbeat.status')
          if [ "$heartbeat_status" != "UP" ]; then
            echo "processorHeartbeat is $heartbeat_status, expected UP" >&2
            exit 1
          fi

          echo "verified: deployed SHA $deployed_sha matches, processorHeartbeat is UP"

  # Same opt-in pattern as deploy-oracle, for the Cloudflare Pages side.
  # Flip vars.CLOUDFLARE_DEPLOY_ENABLED once the Pages project exists and
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are set as repo secrets.
  deploy-console:
    runs-on: ubuntu-latest
    needs: affected
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Single source of truth for the deployed console's API target:
      # environment.prod.ts ships a literal placeholder (never a real
      # endpoint) that this substitutes with the same vars.PROD_API_URL
      # verify-deploy already reads, avoiding a second hardcoded URL that
      # could drift from it.
      - name: Point production build at the deployed API
        run: |
          sed -i "s|__PROD_API_URL__|${{ vars.PROD_API_URL }}|" apps/console/src/environments/environment.prod.ts
      - run: npx nx build console --configuration=production
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/console/browser --project-name=fleetpulse-console
