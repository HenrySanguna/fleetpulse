services:
  postgis:
    build:
      context: ./docker/postgis-partman
    image: fleetpulse/postgis-partman:local
    environment:
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    ports:
      - "5432:5432"
    volumes:
      - fleetpulse-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpulse -d fleetpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fleetpulse

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fleetpulse

networks:
  fleetpulse:
    driver: bridge

volumes:
  fleetpulse-postgis-data:
