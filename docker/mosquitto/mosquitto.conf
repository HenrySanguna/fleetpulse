listener 1883
protocol mqtt

listener 9001
protocol websockets

# 02-add-fleet-auth (tasks 5.1/5.2): anonymous access is denied on both
# listeners and the dynamic-security plugin is the auth/ACL backend. The
# plugin ships statically compiled into the stock eclipse-mosquitto:2 image
# (no custom plugin build) and owns its own JSON-backed credential/ACL store
# at plugin_opt_config_file, which the backend's admin client populates over
# the $CONTROL/dynamic-security/v1 control topic -- see
# MosquittoDynamicSecurityAdminClient and bootstrap-and-run.sh, which
# bootstraps the first admin identity into that store before the broker
# starts (there is no way to create it through the plugin's own control
# topic, since that requires already being an admin).
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence false
log_dest stdout
