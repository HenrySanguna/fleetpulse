# Broker config for the private mosquitto service in docker-compose.prod.yml
# (Oracle Cloud VM). Bind-mounted read-only into
# /mosquitto/config/mosquitto.conf -- there is no custom Dockerfile, the
# stock eclipse-mosquitto:2 image reads this directly.
#
# 1883 for api/processor (internal bridge network only, no published port on
# this service -- see docker-compose.prod.yml). 9001 for the browser-facing
# live map (04-add-live-map, archived): mosquitto itself publishes no port on
# the VM's public IP either way -- Caddy is the sole public entry point and
# reverse-proxies a wss:// path to this listener (docker/caddy/Caddyfile),
# same posture as api:8080. Browser-issued credentials from
# GET /api/mqtt/credentials are subscribe-only, per-org-scoped and ephemeral
# (BrowserMqttCredentialService, 5min TTL), so exposing this listener over
# Caddy does not by itself weaken the ACL posture below.
listener 1883
protocol mqtt

listener 9001
protocol websockets

# 02-add-fleet-auth (tasks 5.1/5.2): same dynamic-security posture as the dev
# config -- anonymous denied, auth/ACL backed by the stock plugin's own
# store, bootstrapped by bootstrap-and-run.sh before the broker starts. See
# docker/mosquitto/mosquitto.conf for the full rationale.
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence false
log_dest stdout
