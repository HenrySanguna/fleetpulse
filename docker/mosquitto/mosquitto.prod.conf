# Broker config for the private fleetpulse-broker Fly app (see
# fly-broker.toml). Injected at deploy time via that file's [[files]]
# directive into /mosquitto/config/mosquitto.conf -- there is no custom
# Dockerfile, the stock eclipse-mosquitto:2 image reads this directly.
#
# No websocket listener here, unlike docker/mosquitto/mosquitto.conf (dev):
# this app has no [[services]]/public IP at all (see fly-broker.toml for
# why), so there is no browser client that could reach a WebSocket listener
# regardless. Browser/WebSocket access to the broker is change
# 04-add-live-map's concern, not this change's.
listener 1883
protocol mqtt

# Same posture and same reasoning as docker/mosquitto/mosquitto.conf (dev):
# anonymous access, no ACLs. Per-topic ACLs and ephemeral per-dispatcher
# credentials are change 02-add-fleet-auth's scope, not this scaffolding
# change. Do not treat this file as the final production posture either --
# it is bootstrap-only, same as the dev config.
allow_anonymous true

persistence false
log_dest stdout
