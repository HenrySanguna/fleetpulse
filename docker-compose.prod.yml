# Production stack for the Oracle Cloud "Always Free" VM (single Ampere A1
# instance, no scale-to-zero) -- see openspec/project.md "Hosting" and
# openspec/changes/00-bootstrap-monorepo/tasks.md, task 6.5, for why: the
# processor process runs a long-lived MQTT consumer plus @Scheduled
# background tasks, so it needs a real always-on VM, not a request-triggered
# serverless target. Same shape as local dev's docker-compose.yml, just
# remote: api + processor + mosquitto as three containers on one host,
# reachable over Docker Compose's own bridge network by service name --
# already proven to work for this exact pattern by
# .github/workflows/ci.yml's docker-and-compose-smoke job (task 6.2), which
# resolves postgis/mosquitto the same way.
#
# Deployed by the deploy-oracle job in .github/workflows/ci.yml: this file,
# docker/mosquitto/mosquitto.prod.conf, docker/mosquitto/bootstrap-and-run.sh
# and docker/caddy/Caddyfile are rsynced to the VM, then
# `docker compose -f docker-compose.prod.yml pull && ... up -d` runs over
# SSH. Requires a .env file already present next to this file on the VM
# (not committed -- see tasks.md task 6.5's manual setup list) providing
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME /
# SPRING_DATASOURCE_PASSWORD for the real Neon database -- Neon itself is
# unaffected by this migration, only the compute target changed. Also
# requires FLEETPULSE_PUBLIC_HOSTNAME (see caddy's own comment below) and
# the MOSQUITTO_DYNSEC_* vars (see mosquitto's own comment below).
#
# caddy is the only service with a published port (80/443): the console
# (Cloudflare Pages, always HTTPS) cannot call a plain-HTTP api at all --
# browsers block that as mixed content regardless of credentials being
# otherwise valid, found live the first time a real browser (not curl, which
# never enforces this) tried to log in. FLEETPULSE_PUBLIC_HOSTNAME (the VM's
# untracked .env) is a *.nip.io hostname wrapping this VM's own IP so Caddy
# can obtain a real Let's Encrypt certificate without owning a domain --
# swap it for a real domain later with no other change needed. api/processor
# expose no public port of their own; mosquitto stays private, same posture
# as the retired fly-broker.toml -- no public/WS broker access until change
# 02-add-fleet-auth lands real ACLs.
services:
  caddy:
    image: caddy:2-alpine
    environment:
      FLEETPULSE_PUBLIC_HOSTNAME: ${FLEETPULSE_PUBLIC_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - fleetpulse

  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      # 02-add-fleet-auth, tasks 5.1/5.2 -- required, no default, same posture
      # as SPRING_DATASOURCE_PASSWORD below: must come from the VM's untracked
      # .env file. See docker/mosquitto/bootstrap-and-run.sh.
      MOSQUITTO_DYNSEC_ADMIN_USERNAME: ${MOSQUITTO_DYNSEC_ADMIN_USERNAME}
      MOSQUITTO_DYNSEC_ADMIN_PASSWORD: ${MOSQUITTO_DYNSEC_ADMIN_PASSWORD}
      MOSQUITTO_DYNSEC_SERVICE_USERNAME: ${MOSQUITTO_DYNSEC_SERVICE_USERNAME}
      MOSQUITTO_DYNSEC_SERVICE_PASSWORD: ${MOSQUITTO_DYNSEC_SERVICE_PASSWORD}
      # Prod demo service, task 5.4 -- read by provision-demo-simulator.sh
      # when the CI deploy step runs it via `docker compose exec`, which
      # inherits this container's own environment (not the deploy shell's).
      # No default: the deploy step only runs provisioning at all when this
      # secret is present (see .github/workflows/ci.yml deploy-oracle).
      MOSQUITTO_DEMO_SIMULATOR_PASSWORD: ${MOSQUITTO_DEMO_SIMULATOR_PASSWORD:-}
      SIMULATOR_ORG_ID: ${SIMULATOR_ORG_ID:-e7de66a7-f8a2-4992-9a57-8d909634609f}
    volumes:
      - ./docker/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/bootstrap-and-run.sh:/mosquitto/bootstrap-and-run.sh:ro
      - ./docker/mosquitto/provision-demo-simulator.sh:/mosquitto/provision-demo-simulator.sh:ro
    command: ["sh", "/mosquitto/bootstrap-and-run.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u \"$$MOSQUITTO_DYNSEC_SERVICE_USERNAME\" -P \"$$MOSQUITTO_DYNSEC_SERVICE_PASSWORD\" -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - fleetpulse

  api:
    image: ghcr.io/henrysanguna/fleetpulse-backend:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FLEETPULSE_PROCESS: api
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FLEETPULSE_MQTT_BROKERURL: tcp://mosquitto:1883
      # 02-add-fleet-auth: api is the only process that speaks the
      # dynamic-security control topic (credential issuance, task 3.1); the
      # service identity below is for its own health indicator's ordinary
      # broker connectivity check.
      FLEETPULSE_MQTT_DYNSEC_ADMINUSERNAME: ${MOSQUITTO_DYNSEC_ADMIN_USERNAME}
      FLEETPULSE_MQTT_DYNSEC_ADMINPASSWORD: ${MOSQUITTO_DYNSEC_ADMIN_PASSWORD}
      FLEETPULSE_MQTT_SERVICE_USERNAME: ${MOSQUITTO_DYNSEC_SERVICE_USERNAME}
      FLEETPULSE_MQTT_SERVICE_PASSWORD: ${MOSQUITTO_DYNSEC_SERVICE_PASSWORD}
      # Public wss:// through caddy's /mqtt-ws route (docker/caddy/Caddyfile),
      # not the internal ws://mosquitto:9001 -- the browser can't resolve
      # "mosquitto" and blocks plain ws:// from this HTTPS console as mixed
      # content anyway (found live via Playwright: "Connecting..." never
      # resolved, 0 vehicles visible despite 04-add-live-map being fully
      # implemented and archived).
      FLEETPULSE_MQTT_BROWSER_WSURL: ${FLEETPULSE_MQTT_BROWSER_WSURL:-wss://${FLEETPULSE_PUBLIC_HOSTNAME}/mqtt-ws}
      FLEETPULSE_MQTT_BROWSER_CREDENTIALTTL: PT5M
    # No published port: caddy is the only public entry point now (see its
    # own comment above). Reachable within the compose network as api:8080.
    # Not required for correctness -- MqttClientFactoryConfig catches
    # MqttException and reports DOWN instead of failing startup -- just
    # cleaner boot ordering (same reasoning documented for the retired
    # deploy-broker -> deploy-backend needs: in prior ci.yml revisions).
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fleetpulse

  processor:
    image: ghcr.io/henrysanguna/fleetpulse-backend:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FLEETPULSE_PROCESS: processor
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FLEETPULSE_MQTT_BROKERURL: tcp://mosquitto:1883
      # 02-add-fleet-auth: processor never talks to the dynamic-security
      # control topic, only the service identity for its heartbeat publish.
      FLEETPULSE_MQTT_SERVICE_USERNAME: ${MOSQUITTO_DYNSEC_SERVICE_USERNAME}
      FLEETPULSE_MQTT_SERVICE_PASSWORD: ${MOSQUITTO_DYNSEC_SERVICE_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fleetpulse

  # Prod demo service (odd/tasks/prod-demo-simulator.md, task 5.3): one-shot
  # idempotent seed of docker/demo/seed-demo-fleet.sql, against the exact
  # same database api/processor use (SPRING_DATASOURCE_*). `profile: demo`
  # keeps it out of ordinary `up -d` runs; `restart: "no"` because a seed
  # run either succeeds once or needs a human to look at why it did not --
  # retrying it forever would just mask a real failure.
  demo-seed:
    image: postgres:17-alpine
    profiles: ["demo"]
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - ./docker/demo/seed-demo-fleet.sql:/seed/seed-demo-fleet.sql:ro
      - ./docker/demo/run-seed.sh:/seed/run-seed.sh:ro
    entrypoint: ["sh", "/seed/run-seed.sh"]
    restart: "no"
    networks:
      - fleetpulse

  # Prod demo service, task 5.5: runs the same backend image as api/processor
  # with FLEETPULSE_PROCESS=simulator (entrypoint.sh), publishing telemetry
  # for exactly the 10 vehicle IDs docker/demo/seed-demo-fleet.sql seeds --
  # keep both lists in sync. Authenticates as the demo-simulator dynsec
  # identity provision-demo-simulator.sh provisions (publish-only), never
  # the broad internal-services identity api/processor use.
  simulator:
    image: ghcr.io/henrysanguna/fleetpulse-backend:${IMAGE_TAG:-latest}
    profiles: ["demo"]
    environment:
      FLEETPULSE_PROCESS: simulator
      SIMULATOR_ORG_ID: ${SIMULATOR_ORG_ID:-e7de66a7-f8a2-4992-9a57-8d909634609f}
      SIMULATOR_VEHICLE_IDS: >-
        8f1cbe99-3d34-49bb-962e-981d28ba4dce,38cf7b2b-c5eb-4a12-bba7-eaa0179ca053,
        7c8767ea-d90e-4b91-8556-ad3f984f86db,7d19f0bc-e91f-4aa6-bfe0-7376f06bc832,
        802154c2-d7e1-46ee-b963-d800addfe6e8,ecd880ad-19bf-4f8a-b291-234668b5f4a2,
        fa9eb9c2-7479-4049-b324-3caf50ed610d,e4399522-ff08-47e5-bb73-51e0e5d7dfa8,
        4cbe7816-18c3-44b2-ba74-c20078bbab11,62a73e93-72f7-4e47-b10f-6a658ae88a16
      SIMULATOR_BROKER_URL: tcp://mosquitto:1883
      SIMULATOR_MQTT_USERNAME: demo-simulator
      SIMULATOR_MQTT_PASSWORD: ${MOSQUITTO_DEMO_SIMULATOR_PASSWORD}
      SIMULATOR_TELEMETRY_INTERVAL_MS: "2000"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fleetpulse

networks:
  fleetpulse:
    driver: bridge

volumes:
  # Persists caddy's issued certificate across container recreation so every
  # deploy doesn't re-request one from Let's Encrypt (rate-limited).
  caddy-data:
  caddy-config:
