fleetpulse:
  cors:
    allowed-origin-patterns:
      - http://localhost:4200
      - https://fleetpulse-console.pages.dev
      - https://*.fleetpulse-console.pages.dev

spring:
  application:
    name: fleetpulse-api
  jpa:
    # Flyway is the only source of schema truth; Hibernate must never create
    # or alter tables (project.md: "Nada de synchronize... fuera de desarrollo").
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    store-type: jdbc
    jdbc:
      # Flyway (domain module's V4 migration) owns the SPRING_SESSION schema
      # instead of Spring Session's own initializer, so it stays versioned
      # like every other table.
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        # 02-add-fleet-auth, task 2.2: design.md originally required
        # HttpOnly/Secure/SameSite=Strict. Deviation, documented per this
        # project's "note deviations, don't silently freelance" convention:
        # the console (Cloudflare Pages) and api (its own host) are, and
        # always will be under this deployment topology, different sites --
        # SameSite=Strict makes the browser withhold the session cookie on
        # every request the console's own JS makes to api, which is not a
        # narrower version of the original requirement, it is login not
        # working at all, found live via Playwright (curl never triggers
        # SameSite enforcement, so this stayed invisible through every
        # earlier manual check). SameSite=None is the standard fix for a
        # legitimate cross-site SPA+API split and still requires Secure
        # (already true, TLS via caddy) -- the CSRF exposure that
        # SameSite=Strict would otherwise additionally guard against is
        # already independently covered by SecurityConfig's synchronizer-
        # token CSRF protection (X-CSRF-TOKEN, session-bound since
        # cross-site-csrf-token), so this is not an unmitigated relaxation.
        http-only: true
        secure: true
        same-site: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # No Spring Security yet (change 02-add-fleet-auth); showing full details
      # unauthenticated is a deliberate bootstrap-stage tradeoff, not a leak of
      # secrets -- indicator details here never include datasource credentials.
      show-details: always
  info:
    # Default "simple" mode abbreviates git.commit.id; "full" is required to
    # surface the complete 40-char SHA needed to identify the deployed build.
    git:
      mode: full
