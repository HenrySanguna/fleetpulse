spring:
  application:
    name: fleetpulse-api
  jpa:
    # Flyway is the only source of schema truth; Hibernate must never create
    # or alter tables (project.md: "Nada de synchronize... fuera de desarrollo").
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    store-type: jdbc
    jdbc:
      # Flyway (domain module's V4 migration) owns the SPRING_SESSION schema
      # instead of Spring Session's own initializer, so it stays versioned
      # like every other table.
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        # 02-add-fleet-auth, task 2.2: design.md requires the dispatcher
        # session cookie to be HttpOnly/Secure/SameSite=Strict. Spring Boot's
        # session autoconfiguration feeds these into Spring Session's cookie
        # serializer, not just the raw servlet container's own cookie.
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # No Spring Security yet (change 02-add-fleet-auth); showing full details
      # unauthenticated is a deliberate bootstrap-stage tradeoff, not a leak of
      # secrets -- indicator details here never include datasource credentials.
      show-details: always
  info:
    # Default "simple" mode abbreviates git.commit.id; "full" is required to
    # surface the complete 40-char SHA needed to identify the deployed build.
    git:
      mode: full
