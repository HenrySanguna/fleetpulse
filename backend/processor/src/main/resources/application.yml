spring:
  application:
    name: fleetpulse-processor
  datasource:
    hikari:
      # Idle connections are closed after 2 min instead of being kept at
      # maximum-pool-size, so an idle processor holds none open against Neon
      # and its compute can scale to zero. maximum-pool-size is unchanged.
      minimum-idle: 0
      idle-timeout: 120000
