# Originally added chasing issue #36 (ProcessorHeartbeatPublisherTest /
# DeviceSimulatorFleetIntegrationTest timing out in CI, never locally): PR #37's
# `nx affected ... --parallel=1` had zero effect (reproduced 5/5 on
# 04-add-live-map's PRs #38-#42) because @nx/gradle's own batch executor
# (node_modules/@nx/gradle/src/executors/gradle/gradle-batch.impl.js) spawns
# every affected Gradle subproject's test task through ONE external
# `gradle-batch-runner-all.jar` process, entirely outside Nx's task scheduler
# -- so `--parallel` at the Nx CLI level never reaches it, while this setting
# (read by Gradle itself at build-config time regardless of which tool
# launches the build) does stop concurrent subproject task execution within
# one Gradle invocation. Confirmed empirically via CI log timestamps (run
# 35023460903): `:api:test` and `:processor:test` overlapped by ~2 minutes
# despite --parallel=1.
#
# NOT actually issue #36's fix, though: PR #55 proved the same two tests
# still failed 100% of the time even in a diff where processor was the only
# subproject with a test task at all (no cross-subproject overlap possible).
# The real cause was a Testcontainers wait-strategy bug in
# SecuredMosquittoTestSupport (both backend/api and backend/processor
# copies) letting the broker report "ready" before its dynsec role/ACL
# provisioning actually finished -- see that class's comment. Kept anyway:
# it is still a real, if smaller, source of unrelated-subproject contention
# on this runner's 2 vCPUs.
org.gradle.parallel=false
