# Issue #36 (ProcessorHeartbeatPublisherTest / DeviceSimulatorFleetIntegrationTest
# timing out in CI, never locally): PR #37 changed `nx affected ... --parallel=1`
# in .github/workflows/ci.yml, which controls how many Nx *tasks* Nx's own
# scheduler dispatches concurrently -- and had zero effect, reproduced 5/5 on
# 04-add-live-map's PRs #38-#42. Root cause found: @nx/gradle's own batch
# executor (node_modules/@nx/gradle/src/executors/gradle/gradle-batch.impl.js)
# spawns every affected Gradle subproject's test task through ONE external
# `gradle-batch-runner-all.jar` process, entirely outside Nx's task scheduler
# -- so `--parallel` at the Nx CLI level never reaches it. Confirmed
# empirically via CI log timestamps (run 35023460903): `:api:test`
# (21:08:56-21:11:55) and `:processor:test` (21:09:52-21:12:49) overlap by
# ~2 minutes despite --parallel=1.
#
# api/domain/processor each spin up their own real PostGIS + Mosquitto
# Testcontainers pair; running them concurrently starves
# ProcessorHeartbeatPublisherTest's MQTT round-trip for CPU/Docker on CI's
# constrained runners. This setting is read by Gradle itself at build-config
# time, regardless of which tool launches the build (the Nx batch runner,
# plain gradlew, or an IDE) -- it is the one place that actually stops
# independent-subproject task concurrency at its source, rather than asking
# whatever orchestrates the invocation to cooperate.
org.gradle.parallel=false
