# Fly.io deployment for the Mosquitto broker (fleetpulse-broker), as a
# second, independent Fly app from fleetpulse-backend (fly.toml). Fly apps
# are one-per-config-file; deploy this one explicitly with
# `flyctl deploy --config fly-broker.toml`, separate from the root
# `flyctl deploy` that targets fly.toml/fleetpulse-backend.
#
# Design call -- private-only, no public exposure at all: fleetpulse-broker
# has NO [[services]] block below and therefore no allocated public IP. It
# is reachable exclusively over Fly's private WireGuard (6PN) network, as
# fleetpulse-broker.internal:1883, from any machine in the same Fly org --
# in particular fleetpulse-backend's api/processor machines (fly.toml).
#
# Why this is safe to do now rather than deferring it: proposal.md scopes
# both "consumo real de MQTT mas alla de una comprobacion de conectividad"
# and the console's broker access out of this change -- browser WebSocket
# access to the broker is change 04-add-live-map's concern. project.md
# defers real auth/ACL on the broker to change 02-add-fleet-auth. Put
# together, there is no legitimate consumer of this broker yet that needs
# public or WebSocket reachability: api and processor (the only current
# clients, via MqttClientFactoryConfig) only ever open a plain TCP
# connection, and only from inside the same private network. Not exposing
# an anonymous-auth broker publicly now is strictly safer than exposing one
# and locking it down later in change 02 -- nothing consumes this broker
# publicly until 02/04 land, so there is no capability lost by waiting.
#
# Uses the stock eclipse-mosquitto:2 image directly (the same image
# docker-compose.yml and the Testcontainers-backed tests already use) -- no
# custom Dockerfile needed. The broker config is injected at deploy time via
# the [[files]] directive below, which copies a local file's content into
# the machine at guest_path. See docker/mosquitto/mosquitto.prod.conf for
# the actual listener/auth settings -- based directly on docker/mosquitto/
# mosquitto.conf (dev): same allow_anonymous/persistence/log_dest posture,
# same "bootstrap only, real ACLs come in change 02" reasoning.
#
# NOT deployed by this change: no Fly app named "fleetpulse-broker" exists
# yet. See openspec/changes/00-bootstrap-monorepo/tasks.md, task 6.5, for
# the exact manual steps (fly apps create fleetpulse-broker, flyctl deploy
# --config fly-broker.toml, then fly secrets set on fleetpulse-backend)
# required before deploy-broker in .github/workflows/ci.yml can run for
# real.
app = "fleetpulse-broker"
primary_region = "iad"

[build]
  image = "eclipse-mosquitto:2"

[[files]]
  guest_path = "/mosquitto/config/mosquitto.conf"
  local_path = "docker/mosquitto/mosquitto.prod.conf"

# No [[services]] block on purpose -- see the private-only design call
# above. [checks] is the app-level (not service-level) form Fly.io provides
# for exactly this case: a Machine with no exposed service that still needs
# a liveness check.
[checks]
  [checks.mqtt]
    type = "tcp"
    port = 1883
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
