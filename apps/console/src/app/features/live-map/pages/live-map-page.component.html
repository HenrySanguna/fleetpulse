<div class="live-map-page flex h-full">
  <aside class="sidebar flex w-[360px] shrink-0 flex-col overflow-y-auto">
    <div class="sidebar-section">
      <console-ui-connection-status [status]="connectionStatus()" />
    </div>
    <div class="sidebar-section">
      <console-ui-vehicle-filters [filters]="filters()" (filtersChange)="onFiltersChange($event)" />
    </div>
    <div class="sidebar-section flex-1 overflow-y-auto">
      <console-ui-vehicle-list
        [vehicles]="vehicles()"
        [selectedVehicleId]="selectedVehicleId()"
        (vehicleSelected)="onVehicleSelected($event)"
      />
    </div>
    <div class="sidebar-section">
      <console-ui-vehicle-detail [vehicle]="selectedVehicle()" />
    </div>
  </aside>
  <main class="map-pane relative flex-1">
    <app-live-map />

    <div class="map-toolbar-chip">{{ vehicles().length }} vehículos visibles</div>

    <div class="map-legend">
      <div class="map-legend-row"><span class="map-legend-dot map-legend-dot-moving"></span>En movimiento</div>
      <div class="map-legend-row"><span class="map-legend-dot map-legend-dot-idling"></span>Ralentí</div>
      <div class="map-legend-row"><span class="map-legend-dot map-legend-dot-stopped"></span>Detenido</div>
      <div class="map-legend-row"><span class="map-legend-dot map-legend-dot-geofence"></span>Geocerca</div>
      <div class="map-legend-row"><span class="map-legend-dot map-legend-dot-track"></span>Recorrido</div>
    </div>
  </main>
</div>
