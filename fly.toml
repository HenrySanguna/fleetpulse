# Fly.io deployment for the two backend processes (api, processor), built
# from the multi-stage Dockerfile at the repo root.
#
# One Fly app, two process groups sharing the same image -- this is the
# Fly-native equivalent of "una sola imagen Docker con ambos jars, el
# comando de arranque decide cual corre" (openspec/changes/
# 00-bootstrap-monorepo/design.md, "Dos procesos, un artefacto"). Two
# separate Fly apps could drift to different image versions between
# deploys, which is exactly the failure mode that design section rules out:
# a processor running against a different domain/geo-core build than api
# produces hard-to-diagnose failures.
#
# entrypoint.sh (docker/backend/entrypoint.sh) reads Fly's own
# FLY_PROCESS_GROUP env var -- injected automatically per machine based on
# the [processes] key below -- to decide which jar to run, so no per-process
# env override is needed here.
#
# NOT deployed by this change: no Fly app named "fleetpulse-backend" exists
# yet and no FLY_API_TOKEN secret is configured. See the section 6 apply
# report for the exact manual steps (fly launch, fly volumes create if a
# managed Postgres is added later, fly secrets set, repo secret/variable
# setup) required before deploy-backend in .github/workflows/ci.yml can run
# for real.
app = "fleetpulse-backend"
primary_region = "iad"

[build]

[processes]
  api = "/app/entrypoint.sh"
  processor = "/app/entrypoint.sh"

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  SERVER_PORT = "8080"

# HTTP surface exists only for the api process group; processor has none by
# design (see design.md, "Salud").
[[services]]
  processes = ["api"]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.http_checks]]
    path = "/actuator/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "get"

[[vm]]
  processes = ["api", "processor"]
  size = "shared-cpu-1x"
  memory = "512mb"
