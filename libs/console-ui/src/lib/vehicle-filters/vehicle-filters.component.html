<div class="flex flex-col gap-2.5">
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5" />
      <path d="M15.5 15.5l-3-3" />
    </svg>
    <input
      pInputText
      type="text"
      class="search-input w-full"
      [value]="filters().search"
      (input)="onSearchInput($event)"
      placeholder="Buscar por etiqueta o ID de vehículo"
      aria-label="Buscar vehículos"
    />
  </div>

  <p-select
    [options]="motionStateOptions"
    optionLabel="label"
    optionValue="value"
    [ngModel]="filters().motionState"
    (ngModelChange)="onMotionStateChange($event)"
    placeholder="Todos los estados"
    class="w-full"
    aria-label="Filtrar por estado de movimiento"
  />

  <label class="flex items-center gap-2 online-only-label" for="online-only-filter">
    <p-checkbox
      [binary]="true"
      [ngModel]="filters().onlineOnly"
      (ngModelChange)="onOnlineOnlyChange($event)"
      inputId="online-only-filter"
    />
    <span>Solo en línea</span>
  </label>
</div>
