<ul class="flex flex-col" role="listbox" aria-label="Vehicles">
  @for (vehicle of vehicles(); track vehicle.vehicleId) {
    <li>
      <button
        type="button"
        role="option"
        class="vehicle-row flex w-full items-center justify-between gap-2 text-left"
        [class.selected]="vehicle.vehicleId === selectedVehicleId()"
        [attr.aria-selected]="vehicle.vehicleId === selectedVehicleId()"
        (click)="vehicleSelected.emit(vehicle.vehicleId)"
      >
        <span class="flex flex-col">
          <span class="vehicle-name">{{ vehicle.label ?? vehicle.vehicleId }}</span>
          <span class="vehicle-id mono">{{ vehicle.vehicleId }}</span>
        </span>
        <span class="flex items-center gap-1">
          <p-tag [severity]="motionSeverity(vehicle)" [value]="vehicle.motionState ?? 'STOPPED'" />
          <p-tag [severity]="vehicle.online ? 'success' : 'danger'" [value]="vehicle.online ? 'Online' : 'Offline'" />
        </span>
      </button>
    </li>
  } @empty {
    <li class="px-4 py-2 text-[13.5px]" style="color: var(--fp-text-faint)">No vehicles match the current filters.</li>
  }
</ul>
